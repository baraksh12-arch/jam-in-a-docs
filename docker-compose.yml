# Docker Compose for Jam in a Docs
# Production-ready multi-service setup

version: '3.8'

services:
  # ==========================================================================
  # PostgreSQL Database
  # ==========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: jamdocs-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jamdocs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jamdocs_password}
      POSTGRES_DB: ${POSTGRES_DB:-jamdocs}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jamdocs"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================================================
  # Redis (Optional - for scaling WebSocket)
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: jamdocs-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================================================
  # Backend API + WebSocket Server
  # ==========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jamdocs-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-jamdocs}:${POSTGRES_PASSWORD:-jamdocs_password}@postgres:5432/${POSTGRES_DB:-jamdocs}?schema=public
      PORT: 3001
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      REDIS_URL: redis://redis:6379
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==========================================================================
  # Frontend (for production builds)
  # ==========================================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jamdocs-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3001/api}
      VITE_WS_URL: ${VITE_WS_URL:-http://localhost:3001}
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: jamdocs-network
